{% extends 'base.html' %}
{% block title %}Escanear QR - Proyecto SIS{% endblock %}
{% block extra_css %}
<style>
    #reader {
        width: 500px;
        margin: 0 auto;
    }
    #result {
        margin-top: 20px;
        padding: 20px;
        background-color: #28a745;
        color: #fff;
        border-radius: 5px;
    }
</style>
{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header bg-dark text-white">
        <h4><i class="fas fa-qrcode"></i> Escanear Código QR</h4>
    </div>
    <div class="card-body text-center">
        <div id="reader"></div>
        <div id="result" style="display:none;">Result Here</div>
        <div class="mt-3">
            <a href="{% url 'poliza_list' %}" class="btn btn-secondary">Volver a la lista</a>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText, decodedResult) => {
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML = 'Código: ' + decodedText;
            html5QrCode.stop();
            const partes = decodedText.split('_');
            if (partes.length >= 2) {
                const recu = partes[1];
                window.location.href = '/polizas/' + recu + '/editar/';
            } else {
                window.location.href = decodeURIComponent(decodedText);
            }
        },
        (errorMessage) => { }
    ).catch(err => {
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').style.backgroundColor = '#dc3545';
        document.getElementById('result').innerHTML = 'Error al acceder a la cámara: ' + err;
    });
</script>
{% endblock %}
