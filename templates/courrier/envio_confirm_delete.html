{% extends 'base.html' %}
{% block title %}Eliminar Envío - Proyecto SIS{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header bg-danger text-white">
        <h4 class="mb-0"><i class="fas fa-trash"></i> Eliminar Envío de Correo</h4>
    </div>
    <div class="card-body">
        <p>¿Está seguro de eliminar el envío <strong>#{{ object.id }} - {{ object.destinataire_envoie_courrier }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="fas fa-check"></i> Sí, eliminar</button>
            <a href="{% url 'courrier_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
