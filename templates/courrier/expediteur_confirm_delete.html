{% extends 'base.html' %}
{% block title %}Eliminar Remitente - Proyecto SIS{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header bg-danger text-white">
        <h4 class="mb-0"><i class="fas fa-trash"></i> Eliminar Remitente</h4>
    </div>
    <div class="card-body">
        <p>¿Está seguro de eliminar al remitente <strong>{{ object.nom_expediteur }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="fas fa-check"></i> Sí, eliminar</button>
            <a href="{% url 'expediteur_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
