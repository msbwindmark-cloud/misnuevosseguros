{% extends 'base.html' %}
{% block title %}{% if object %}Editar{% else %}Nuevo{% endif %} Tipo de Documento - Proyecto SIS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0"><i class="fas fa-file-alt"></i> {% if object %}Editar Tipo de Documento{% else %}Nuevo Tipo de Documento{% endif %}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Tipo de Documento</label>
                        <input type="text" name="tipo_documento" class="form-control" required value="{{ object.tipo_documento|default:'' }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                        <a href="{% url 'tipo_documento_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
