{% extends 'base.html' %}
{% block title %}Importar Clientes - Proyecto SIS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="fas fa-upload"></i> Importar Clientes desde Excel</h4>
                <a href="{% url 'cliente_list' %}" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Volver</a>
            </div>
            <div class="card-body">
                <p class="text-muted">Formato: Código, Nombre, Teléfono, Email (la primera fila debe ser encabezados).</p>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Archivo Excel</label>
                        <input type="file" name="archivo" class="form-control" accept=".xlsx,.xls" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-upload"></i> Importar</button>
                        <a href="{% url 'cliente_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
