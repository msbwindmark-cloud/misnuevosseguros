{% extends 'base.html' %}
{% block title %}Eliminar Cliente - Proyecto SIS{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header bg-danger text-white">
        <h4><i class="fas fa-trash"></i> Confirmar Eliminación</h4>
    </div>
    <div class="card-body">
        <p>¿Estás seguro de eliminar el cliente <strong>{{ cliente.nom_client }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'cliente_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
