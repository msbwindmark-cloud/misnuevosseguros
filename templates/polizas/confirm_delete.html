{% extends 'base.html' %}
{% block title %}Eliminar Póliza - Proyecto SIS{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header bg-danger text-white">
        <h4><i class="fas fa-trash"></i> Confirmar Eliminación</h4>
    </div>
    <div class="card-body">
        <p>¿Estás seguro de eliminar la póliza <strong>{{ poliza.recu }} - {{ poliza.assure }}</strong>?</p>
        <form method="post" action="{% url 'poliza_list_delete' %}">
            {% csrf_token %}
            <input type="hidden" name="pk" value="{{ poliza.recu }}">
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'poliza_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
