{% extends 'base.html' %}
{% block title %}{% if object %}Editar{% else %}Nuevo{% endif %} Experto - Proyecto SIS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="fas fa-user-md"></i> {% if object %}Editar{% else %}Nuevo{% endif %} Experto</h4>
                <a href="{% url 'experto_list' %}" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Volver</a>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Nombre del Experto</label>
                        <input type="text" name="nom_expert" class="form-control" value="{{ object.nom_expert|default:'' }}" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                        <a href="{% url 'experto_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
