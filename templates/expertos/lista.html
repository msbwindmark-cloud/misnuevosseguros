{% extends 'base.html' %}
{% block title %}Expertos - Proyecto SIS{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fas fa-user-md"></i> Lista de Expertos</h4>
        <a href="{% url 'experto_create' %}" class="btn btn-success btn-sm"><i class="fas fa-plus"></i> Nuevo Experto</a>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover datatable">
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Creado</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                    {% for e in expertos %}
                    <tr>
                        <td>{{ e.id }}</td>
                        <td>{{ e.nom_expert }}</td>
                        <td>{{ e.creado_el|date:"d/m/Y" }}</td>
                        <td>
                            <a href="{% url 'experto_update' e.id %}" class="btn btn-warning btn-sm"><i class="fas fa-edit"></i></a>
                            <a href="{% url 'experto_delete' e.id %}" class="btn btn-danger btn-sm swal-confirm"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="4" class="text-center">No hay expertos</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
